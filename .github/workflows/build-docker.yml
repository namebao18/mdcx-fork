# MDCx 魔改版自动构建工作流
# 参照 octopus 仓库的 build-docker.yml：
#   1. 只构建 linux/amd64 单平台（NAS 用）
#   2. 只推送 ghcr.io，用仓库自带的 GITHUB_TOKEN，无需配置任何 secrets
#   3. 用 GITHUB_TOKEN 推送的包会自动关联本仓库，并继承仓库可见性（本仓库 public -> 包 public）
#
# 触发方式：
#   - 推送到 main 分支时自动构建
#   - 也可以在 Actions 页面手动触发（workflow_dispatch）
#
# 镜像地址：ghcr.io/namebao18/mdcx-fork:mokr-v1
#   （包名必须与本仓库名一致，GITHUB_TOKEN 才有推送权限）
name: build-docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # 推送 ghcr.io 镜像需要

jobs:
  build:
    name: build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag 固定，便于 NAS 侧锁定；改代码后手动改这个版本号再 push
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/namebao18/mdcx-fork:mokr-v1
            ghcr.io/namebao18/mdcx-fork:latest
